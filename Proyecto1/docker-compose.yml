# SG-Food · Flujo ELT con Python, Airflow 3, dbt y PostgreSQL
#
#   docker compose up -d --build              -> bases de datos + Airflow (http://localhost:8080)
#   docker compose --profile bi up -d         -> además Metabase       (http://localhost:3000)

name: sgfood

x-airflow-common: &airflow-common
  build:
    context: .
    dockerfile: docker/airflow/Dockerfile
  image: sgfood-airflow:3.3.2
  user: "${AIRFLOW_UID:-50000}:0"
  environment: &airflow-env
    # --- Airflow ---
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:${AIRFLOW_DB_PASSWORD}@airflow-db/airflow
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY}
    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET}
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-apiserver:8080/execution/
    AIRFLOW__CORE__DAGS_FOLDER: /opt/sgfood/dags
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__CORE__DEFAULT_TIMEZONE: America/Guatemala
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_USERS: admin:admin
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_PASSWORDS_FILE: /opt/airflow/simple_auth_passwords.json
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: "true"
    # --- Pipeline (dentro de la red de Docker los servicios usan el puerto 5432) ---
    PYTHONPATH: /opt/sgfood/src
    OLTP_HOST: oltp-db
    OLTP_PORT: "5432"
    OLTP_DB: ${OLTP_DB}
    OLTP_USER: ${OLTP_USER}
    OLTP_PASSWORD: ${OLTP_PASSWORD}
    DW_HOST: dw-db
    DW_PORT: "5432"
    DW_DB: ${DW_DB}
    DW_USER: ${DW_USER}
    DW_PASSWORD: ${DW_PASSWORD}
    DBT_BIN: /opt/dbt-venv/bin/dbt
    DBT_PROJECT_DIR: /opt/sgfood/dbt/sgfood
  volumes:
    - ./:/opt/sgfood
    - ./airflow/logs:/opt/airflow/logs
  depends_on: &airflow-depends
    airflow-db:
      condition: service_healthy
    oltp-db:
      condition: service_healthy
    dw-db:
      condition: service_healthy

services:
  # ------------------------------------------------------------ Fuente y DW
  oltp-db:
    image: postgres:16
    container_name: sgfood-oltp-db
    environment:
      POSTGRES_USER: ${OLTP_ADMIN_USER}
      POSTGRES_PASSWORD: ${OLTP_ADMIN_PASSWORD}
      POSTGRES_DB: ${OLTP_DB}
      OLTP_USER: ${OLTP_USER}
      OLTP_PASSWORD: ${OLTP_PASSWORD}
    ports:
      - "${OLTP_PORT:-55433}:5432"   # puerto del host configurable en .env
    volumes:
      - oltp_data:/var/lib/postgresql/data
      # 01_sgfood_oltp.sql (esquema + datos) y 02_etl_reader.sh (usuario de lectura)
      - ./sql/oltp:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${OLTP_ADMIN_USER} -d ${OLTP_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  dw-db:
    image: postgres:16
    container_name: sgfood-dw-db
    environment:
      POSTGRES_USER: ${DW_USER}
      POSTGRES_PASSWORD: ${DW_PASSWORD}
      POSTGRES_DB: ${DW_DB}
      BI_READER_USER: ${BI_READER_USER}
      BI_READER_PASSWORD: ${BI_READER_PASSWORD}
    ports:
      - "${DW_PORT:-55434}:5432"
    volumes:
      - dw_data:/var/lib/postgresql/data
      - ./sql/dw/00_ddl_datawarehouse.sql:/docker-entrypoint-initdb.d/00_ddl_datawarehouse.sql:ro
      - ./sql/dw/01_bi_reader.sh:/docker-entrypoint-initdb.d/01_bi_reader.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DW_USER} -d ${DW_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  # ---------------------------------------------------------------- Airflow
  airflow-db:
    image: postgres:16
    container_name: sgfood-airflow-db
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: ${AIRFLOW_DB_PASSWORD}
      POSTGRES_DB: airflow
    volumes:
      - airflow_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow -d airflow"]
      interval: 5s
      timeout: 5s
      retries: 20

  airflow-init:
    <<: *airflow-common
    container_name: sgfood-airflow-init
    command: ["bash", "-c", "airflow db migrate && airflow version"]
    restart: "no"

  airflow-apiserver:
    <<: *airflow-common
    container_name: sgfood-airflow-apiserver
    # El archivo de contraseñas se genera desde .env al arrancar (no se guarda en el repo)
    command:
      - bash
      - -c
      - 'echo "{\"admin\": \"$${AIRFLOW_ADMIN_PASSWORD}\"}" > /opt/airflow/simple_auth_passwords.json && exec airflow api-server'
    environment:
      <<: *airflow-env
      AIRFLOW_ADMIN_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD}
    ports:
      - "${AIRFLOW_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/api/v2/version"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    restart: unless-stopped
    depends_on:
      <<: *airflow-depends
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    container_name: sgfood-airflow-scheduler
    command: scheduler
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8974/health"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    restart: unless-stopped
    depends_on:
      <<: *airflow-depends
      airflow-init:
        condition: service_completed_successfully

  airflow-dag-processor:
    <<: *airflow-common
    container_name: sgfood-airflow-dag-processor
    command: dag-processor
    restart: unless-stopped
    depends_on:
      <<: *airflow-depends
      airflow-init:
        condition: service_completed_successfully

  # --------------------------------------------------- Visualización (opcional)
  metabase:
    image: metabase/metabase:v0.64.1.1
    container_name: sgfood-metabase
    profiles: ["bi"]
    environment:
      MB_DB_FILE: /metabase-data/metabase.db
      JAVA_TIMEZONE: America/Guatemala
    ports:
      - "${METABASE_PORT:-3000}:3000"
    volumes:
      - metabase_data:/metabase-data
    depends_on:
      dw-db:
        condition: service_healthy

volumes:
  oltp_data:
  dw_data:
  airflow_db_data:
  metabase_data:
